name: android-apk

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: "27.2.12479018"
      ANDROID_HOME: "/usr/local/lib/android/sdk"
      ANDROID_NDK_HOME: "/usr/local/lib/android/sdk/ndk/27.2.12479018"
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Install NDK
        run: sdkmanager "ndk;${{ env.NDK_VERSION }}"

      - name: Set up Rust (aarch64-linux-android)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Tauri CLI locally
        run: npm install

      - name: Prepare sidecar + runtime (Termux python/ffmpeg/yt-dlp)
        run: node scripts/ci-prep-android.mjs

      - name: Init Android project
        run: npx --yes @tauri-apps/cli@2 android init --ci

      - name: Add POST_NOTIFICATIONS permission to manifest
        run: |
          MAN=src-tauri/gen/android/app/src/main/AndroidManifest.xml
          grep -q POST_NOTIFICATIONS "$MAN" ||             sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <application#' "$MAN"

      - name: Build debug APK (aarch64)
        run: npx --yes @tauri-apps/cli@2 android build --apk --debug --target aarch64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lilyco-android-aarch64
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk

      - name: Draft Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          draft: true
